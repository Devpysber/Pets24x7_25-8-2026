# Included by every location in the pets24x7 vhost: nginx drops inherited
# add_header directives as soon as a location sets one of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
# Browsers remember to use HTTPS for a year. No includeSubDomains: mail-only
# subdomains (send.pets24x7.com) are not served over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
