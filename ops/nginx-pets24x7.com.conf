# Pets24x7 static site. Rules mirror pets24x7_new/.htaccess.
# www -> apex redirect lives in its own server block below.

server {
    server_name pets24x7.com app.pets24x7.com;

    root /var/www/pets24x7;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml;

    # Deny dotfiles, source/build files, and Netlify _headers/_redirects.
    location ~ (^|/)\.  { deny all; }
    location ~ \.(py|md|gs|bat|toml)$ { deny all; }
    location ~ (^|/)_   { deny all; }

    # Legacy query-string URLs -> clean URLs.
    location = /city.html {
        if ($arg_country ~ ^[A-Z]+$) { set $c 1; }
        if ($arg_cat) { set $c "${c}1"; }
        if ($c = "11") { return 301 /$arg_country/$arg_city/$arg_cat/; }
        if ($c = "1")  { return 301 /$arg_country/$arg_city/; }
        return 301 /;
    }
    location = /listing.html {
        if ($arg_country ~ ^[A-Z]+$) { return 301 /$arg_country/$arg_city/$arg_id/; }
        return 301 /;
    }

    # Uppercase country prefixes -> lowercase.
    location ~ ^/IN/(.*)$ { return 301 /in/$1; }
    location ~ ^/US/(.*)$ { return 301 /us/$1; }

    # Review short-links: one static page each, code handed over as a query param.
    location ~ "^/review/([A-Z0-9]{4,16})/?$"        { include snippets/pets24x7-security.conf; try_files /review/index.html =404; }
    location ~ "^/review/([A-Z0-9]{4,16})/form/?$"   { include snippets/pets24x7-security.conf; try_files /review/form/index.html =404; }
    location ~ "^/review/([A-Z0-9]{4,16})/thanks/?$" { include snippets/pets24x7-security.conf; try_files /review/thanks/index.html =404; }

    # /r/<CODE> is served by the API, not this site.
    location ~ "^/r/([A-Z0-9]{4,16})/?$" { return 302 https://api.pets24x7.com/r/$1; }

    # Long-lived only for assets whose CONTENT changes together with their name,
    # or which effectively never change. Nothing here is content-hashed, so
    # `immutable` is deliberately absent: it forbids revalidation outright, and
    # a reload could not pick up a replaced file.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # styles.css and every .js file are served under a fixed name that a deploy
    # overwrites in place. Caching those for a year behind `immutable` meant a
    # shipped change stayed invisible to anyone who had loaded the site before —
    # which is exactly what "it deployed but I cannot see it" looks like.
    # no-cache does not mean "do not store": the browser keeps the file and
    # revalidates, so an unchanged asset costs one 304 and no body.
    location ~* \.(css|js)$ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, no-cache" always;
    }
    # The signed-in panels are application shells, not content. Five minutes of
    # staleness there is what "it deployed but I cannot see the new screen"
    # looks like: the markup carries the nav and the view panes, so a cached
    # shell hides a whole new section until the cache lapses. `^~` is required
    # for this prefix to win over the .html regex below.
    location ^~ /dashboard/ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.html$ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=600" always;
    }

    # Directory URLs get a trailing slash, then fall back to the pretty 404.
    location / {
        include snippets/pets24x7-security.conf;
        try_files $uri $uri/ $uri/index.html =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pets24x7.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pets24x7.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.pets24x7.com;
    return 301 https://pets24x7.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pets24x7.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pets24x7.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pets24x7.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pets24x7.com app.pets24x7.com;
    return 404; # managed by Certbot


}

server {
    if ($host = www.pets24x7.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.pets24x7.com;
    return 404; # managed by Certbot


}