# Pets24x7 static site. Rules mirror pets24x7_new/.htaccess.
# www -> apex redirect lives in its own server block below.

server {
    server_name pets24x7.com app.pets24x7.com;

    root /var/www/pets24x7;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml;

    # Deny dotfiles, source/build files, and Netlify _headers/_redirects.
    location ~ (^|/)\.  { deny all; }
    location ~ \.(py|md|gs|bat|toml)$ { deny all; }
    location ~ (^|/)_   { deny all; }

    # Legacy query-string URLs -> clean URLs.
    location = /city.html {
        if ($arg_country ~ ^[A-Z]+$) { set $c 1; }
        if ($arg_cat) { set $c "${c}1"; }
        if ($c = "11") { return 301 /$arg_country/$arg_city/$arg_cat/; }
        if ($c = "1")  { return 301 /$arg_country/$arg_city/; }
        return 301 /;
    }
    location = /listing.html {
        if ($arg_country ~ ^[A-Z]+$) { return 301 /$arg_country/$arg_city/$arg_id/; }
        return 301 /;
    }

    # Uppercase country prefixes -> lowercase.
    location ~ ^/IN/(.*)$ { return 301 /in/$1; }
    location ~ ^/US/(.*)$ { return 301 /us/$1; }
    # Bare country roots have no index page (nginx answered 403); send them home.
    location ~ ^/(in|us)/?$ { return 301 /; }

    # Review short-links: one static page each, code handed over as a query param.
    location ~ "^/review/([A-Z0-9]{4,16})/?$"        { include snippets/pets24x7-security.conf; try_files /review/index.html =404; }
    location ~ "^/review/([A-Z0-9]{4,16})/form/?$"   { include snippets/pets24x7-security.conf; try_files /review/form/index.html =404; }
    location ~ "^/review/([A-Z0-9]{4,16})/thanks/?$" { include snippets/pets24x7-security.conf; try_files /review/thanks/index.html =404; }

    # /r/<CODE> is served by the API, not this site.
    location ~ "^/r/([A-Z0-9]{4,16})/?$" { return 302 https://api.pets24x7.com/r/$1; }

    # Long-lived only for assets whose CONTENT changes together with their name,
    # or which effectively never change. Nothing here is content-hashed, so
    # `immutable` is deliberately absent: it forbids revalidation outright, and
    # a reload could not pick up a replaced file.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # styles.css and every .js file are served under a fixed name that a deploy
    # overwrites in place. Caching those for a year behind `immutable` meant a
    # shipped change stayed invisible to anyone who had loaded the site before —
    # which is exactly what "it deployed but I cannot see it" looks like.
    # no-cache does not mean "do not store": the browser keeps the file and
    # revalidates, so an unchanged asset costs one 304 and no body.
    location ~* \.(css|js)$ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, no-cache" always;
    }
    # The signed-in panels are application shells, not content. Five minutes of
    # staleness there is what "it deployed but I cannot see the new screen"
    # looks like: the markup carries the nav and the view panes, so a cached
    # shell hides a whole new section until the cache lapses. `^~` is required
    # for this prefix to win over the .html regex below.
    location ^~ /dashboard/ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.html$ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=600" always;
    }

    # Per-city listing data. Rewritten by every publish (nightly, or the admin
    # "Publish site" button), so it is kept only as long as the HTML that
    # reads it. `^~` so the .json never falls to a regex location.
    # Only the <cc>-<city>.json files the pages fetch are served. Anything else
    # that lands in data/ is not public: the API's JSON mirror
    # (imported_listings.json, full records with hidden rows and business
    # email) sits in the same directory of the checkout. A nested location's
    # `return` is not inherited, so the 404 below only answers the rest.
    location ^~ /data/ {
        location ~ "^/data/(in|us)-[a-z0-9-]+\.json$" {
            include snippets/pets24x7-security.conf;
            add_header Cache-Control "public, max-age=300" always;
            try_files $uri =404;
        }
        return 404;
    }

    # Listing photos written by the publish export. The file name is a hash of
    # its bytes, so a changed photo is a new URL and the old one never
    # changes: safe to cache for good. `^~` beats the image regex above.
    location ^~ /media/ {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Directory URLs get a trailing slash; a clean /in|us/ URL with no page of
    # its own falls back to the generic templates; anything else is the pretty
    # 404.
    location / {
        include snippets/pets24x7-security.conf;
        try_files $uri $uri/ $uri/index.html @listing_fallback;
    }

    # Cities and listings added after the last publish have no folder yet.
    # Mirrors .htaccess (and serve.py): the clean URL is kept and the generic
    # page resolves the record from the API instead of a 404. A city+category
    # URL has the same shape as a listing URL, so the known category slugs go
    # to the city page first; anything else in that position is a listing id.
    # `rewrite ... break` serves the file from THIS location: an internal
    # redirect would land on `location = /city.html` above, which 301s every
    # request for the template by name to the home page.
    location @listing_fallback {
        include snippets/pets24x7-security.conf;
        add_header Cache-Control "public, max-age=300, s-maxage=600" always;
        default_type text/html;
        rewrite "^/(in|us)/[a-z0-9-]+/(veterinary-clinics|emergency-animal-hospital|vaccination-centers|mobile-vet-services|specialty-vets-exotics-avian-reptiles|veterinary-labs-diagnostics|pet-dental-care|pet-physiotherapy-rehab|pet-grooming-spa|pet-boarding-daycare|pet-walking|pet-training-obedience-behavior|pet-sitting-in-home-care|pet-relocation-services|pet-taxi-transport|pet-therapy-services|pet-store|pet-adoption)/?$" /city.html break;
        rewrite "^/(in|us)/[a-z0-9-]+/page/[0-9]+/?$" /city.html break;
        rewrite "^/(in|us)/[a-z0-9-]+/[^/]+/?$" /listing.html break;
        rewrite "^/(in|us)/[a-z0-9-]+/?$" /city.html break;
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pets24x7.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pets24x7.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.pets24x7.com;
    return 301 https://pets24x7.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pets24x7.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pets24x7.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pets24x7.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pets24x7.com app.pets24x7.com;
    return 404; # managed by Certbot


}

server {
    if ($host = www.pets24x7.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.pets24x7.com;
    return 404; # managed by Certbot


}