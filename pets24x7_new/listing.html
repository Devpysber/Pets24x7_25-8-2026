<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2563EB" />
<title id="pageTitle">Pet Service Listing | Pets24x7.com</title>
<meta name="description" id="pageDesc" content="Verified pet business listing with its Google Maps profile. Direct WhatsApp enquiries. Zero booking fees on Pets24x7.com." />
<!-- No static canonical: this template serves every /in/ and /us/ URL that has
     no pre-built page, and a fixed href pointed all of them at the home page.
     The clean path is set here at once; the script below refines it. -->
<script>(function(){var p=location.pathname;if(!/^\/(in|us)\/[a-z0-9-]/.test(p))return;if(p.slice(-1)!=='/')p+='/';var l=document.createElement('link');l.rel='canonical';l.id='pageCanonical';l.href='https://pets24x7.com'+p;document.head.appendChild(l);})();</script>
<!-- Social cards. Scrapers mostly do not run JS, so these defaults are what a
     shared fallback URL shows; render() fills in the business once loaded.
     Pre-built /in/ and /us/ pages carry their own (build_pages.social_meta).
     No static og:url: a scraper would take the home page as this page's
     canonical; without one it uses the URL it fetched. JS adds the real one. -->
<meta property="og:type" content="business.business" />
<meta property="og:site_name" content="Pets24x7" />
<meta property="og:title" id="ogTitle" content="Pet Service Listing | Pets24x7.com" />
<meta property="og:description" id="ogDesc" content="Verified pet business listing. Direct WhatsApp enquiries. Zero booking fees on Pets24x7.com." />
<meta property="og:image" id="ogImage" content="https://pets24x7.com/og-image.jpg" />
<meta property="og:image:alt" id="ogImageAlt" content="Pets24x7" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" id="twTitle" content="Pet Service Listing | Pets24x7.com" />
<meta name="twitter:description" id="twDesc" content="Verified pet business listing. Direct WhatsApp enquiries. Zero booking fees on Pets24x7.com." />
<meta name="twitter:image" id="twImage" content="https://pets24x7.com/og-image.jpg" />
<link rel="icon" type="image/png" href="/pets24x7_logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #2563EB; --primary-dark: #1D4ED8; --primary-light: #EFF6FF;
    --bg: #FFFFFF; --bg-alt: #F9FAFB;
    --text: #1F2937; --text-muted: #6B7280; --text-light: #9CA3AF;
    --success: #10B981; --whatsapp: #25D366; --whatsapp-dark: #1DA851;
    --warning: #F59E0B; --border: #E5E7EB;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
    --radius: 10px; --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg-alt); line-height: 1.5; font-size: 15px; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: var(--primary); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  .header { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 70px; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; line-height: 1; }
  .brand-logo{height:46px;width:auto;max-width:min(200px,46vw);border-radius:0;object-fit:contain;display:block}
  .brand-mark { display: flex; flex-direction: column; }
  .brand-name { font-weight: 800; font-size: 22px; color: var(--primary); letter-spacing: -0.5px; line-height: 1; }
  .brand-name .tld { color: var(--text); }
  .brand-tag { font-size: 9px; font-weight: 600; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-cta { display: inline-flex; align-items: center; gap: 8px; background: var(--whatsapp); color: #fff !important; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .header-cta svg { width: 16px; height: 16px; }
  .call-link { color: var(--primary); font-weight: 600; font-size: 14px; }

  .breadcrumb { padding: 14px 0 0; font-size: 13px; color: var(--text-muted); }
  .breadcrumb a { color: var(--text-muted); }
  .breadcrumb a:hover { color: var(--primary); }
  @media (pointer: coarse) { .breadcrumb a { display: inline-block; padding: 10px 3px; margin: -10px -3px; } }

  .title-block { padding: 12px 0 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .title-block h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 6px; }
  .meta-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
  .meta-row .rating-pill { background: var(--success); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .share-row { display: flex; gap: 8px; }
  .share-btn { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
  .share-btn:hover { background: var(--bg-alt); }

  /* ---- Photo collage ---- */
  .gallery { display: grid; grid-template-columns: 1.7fr 1fr 1fr; grid-template-rows: 210px 210px; gap: 8px; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; box-shadow: var(--shadow); }
  .gallery figure { position: relative; margin: 0; overflow: hidden; background: linear-gradient(135deg, #DBEAFE, #EDE9FE); }
  .gallery figure img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .gallery figure:hover img { transform: scale(1.05); }
  .gallery figure figcaption { position: absolute; left: 10px; bottom: 10px; color: #fff; font-size: 11.5px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.5); background: rgba(15,23,42,0.4); padding: 3px 9px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; }
  .gallery figure:hover figcaption { opacity: 1; }
  .gallery .g-main { grid-row: 1 / 3; grid-column: 1; }
  .gallery .g-wide { grid-column: 2 / 4; }
  @media (max-width: 640px) {
    .gallery { grid-template-columns: 1fr 1fr; grid-template-rows: 150px 150px; }
    .gallery .g-main { grid-column: 1 / 3; grid-row: 1; }
    .gallery .g-wide { grid-column: 1 / 3; grid-row: 2; }
    .gallery figure:nth-child(2), .gallery figure:nth-child(3) { display: none; }
  }

  .pdp-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; padding-bottom: 60px; }
  .pdp-main section { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 18px; }
  .pdp-main h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
  .pdp-main p { color: var(--text-muted); line-height: 1.7; }
  .amenity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .amenity-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
  .amenity-row svg { width: 18px; height: 18px; color: var(--success); flex-shrink: 0; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }

  .greviews-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .greviews-score { background: var(--success); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 22px; font-weight: 800; line-height: 1; }
  .greviews-score small { display: block; font-size: 11px; font-weight: 600; opacity: 0.9; margin-top: 2px; }
  .glogo-big { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; line-height: 1.2; }
  .glogo-big .gB{color:#4285F4}.glogo-big .go1{color:#EA4335}.glogo-big .go2{color:#FBBC04}.glogo-big .gg{color:#4285F4}.glogo-big .gl{color:#34A853}.glogo-big .ge{color:#EA4335}
  .glogo-big a { color: var(--primary); font-weight: 600; font-size: 13px; text-decoration: none; display: block; margin-top: 4px; }
  .glogo-big a:hover { text-decoration: underline; }
  .recent-row { margin: 18px 0; }
  .recent-row .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .recent-squares { display: flex; gap: 6px; flex-wrap: wrap; }
  .recent-square { width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: #fff; }
  .rs-5{color:#10B981;border-color:#10B981}.rs-4{color:#3B82F6;border-color:#3B82F6}.rs-3{color:#F59E0B;border-color:#F59E0B}.rs-2{color:#F97316;border-color:#F97316}.rs-1{color:#EF4444;border-color:#EF4444}
  .ai-summary { background: linear-gradient(135deg, #EFF6FF, #ECFDF5); border: 1px solid #BFDBFE; border-radius: 10px; padding: 14px 16px; margin-top: 6px; }
  .ai-summary .ai-tag { color: var(--primary); font-size: 12px; font-weight: 700; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 5px; }
  .ai-summary p { color: var(--text); font-size: 14px; margin: 0 !important; line-height: 1.6; }
  .gmap-embed { width: 100%; height: 280px; border: 0; border-radius: 10px; margin-top: 14px; }

  .info-block { padding: 14px; background: var(--bg-alt); border-radius: 8px; }
  .info-block strong { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .info-block span { font-size: 14px; color: var(--text); font-weight: 600; }
  .info-block a { color: var(--primary); }
  .policy-list { list-style: none; }
  .policy-list li { padding: 10px 0; border-bottom: 1px dashed var(--border); display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .policy-list li:last-child { border-bottom: none; }
  .policy-list li span:first-child { color: var(--text-muted); }
  .policy-list li span:last-child { color: var(--text); font-weight: 600; text-align: right; }

  .booking-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); position: sticky; top: 90px; height: fit-content; }
  .booking-card .cat-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .booking-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
  .booking-card .price-tax { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .form-field { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; transition: border-color 0.2s, box-shadow 0.2s; }
  .form-field:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .form-field label { display: block; font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-field input, .form-field select, .form-field textarea { border: none; outline: none; background: transparent; width: 100%; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); padding: 4px 0 0; }
  .form-field textarea { resize: vertical; font-weight: 500; min-height: 60px; }
  @media (pointer: coarse), (max-width: 768px) { .form-field input, .form-field select { min-height: 40px; } }
  .form-field-full { grid-column: 1 / 3; }
  .form-error { color: #DC2626; font-size: 12px; margin-top: 6px; display: none; }
  .form-error.show { display: block; }

  .submit-wa { background: var(--whatsapp); color: #fff !important; width: 100%; padding: 16px; border-radius: 10px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; box-shadow: 0 8px 20px rgba(37,211,102,0.3); transition: all 0.2s; }
  .submit-wa:hover { background: var(--whatsapp-dark); transform: translateY(-2px); }
  .submit-wa svg { width: 20px; height: 20px; }
  .secondary-call { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; color: var(--primary); font-weight: 700; font-size: 14px; transition: all 0.2s; }
  .secondary-call:hover { background: var(--primary-light); border-color: var(--primary); }

  .trust-points { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .trust-points li { list-style: none; display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; color: var(--text-muted); }
  .trust-points li::before { content: "✓"; color: var(--success); font-weight: 800; }

  .float-wa { position: fixed; z-index: 90; bottom: 18px; right: 18px; width: 50px; height: 50px; border-radius: 50%; background: var(--whatsapp); color: #fff; box-shadow: 0 6px 18px rgba(37,211,102,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
  .float-wa:hover { transform: scale(1.08); }
  .float-wa svg { width: 26px; height: 26px; }
  .float-wa span { display: none; }

  footer { background: #0F172A; color: #94A3B8; padding: 36px 0 20px; font-size: 14px; }
  footer .footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  footer a { color: #94A3B8; }

  .not-found { background: #fff; border-radius: var(--radius-lg); padding: 60px 20px; text-align: center; margin: 40px 0; }
  .not-found h2 { font-size: 24px; margin-bottom: 12px; }

  @media (max-width: 980px) {
    .pdp-layout { grid-template-columns: 1fr; }
    .booking-card { position: static; }
    .gallery { grid-template-rows: 190px 150px; }
  }
  @media (max-width: 640px) {
    /* Two stacked photos (main + wide); the old 3-row template here left an
       empty 100px band under them. */
    .gallery { grid-template-columns: 1fr; grid-template-rows: 210px 130px; }
    .gallery .g-main, .gallery .g-wide { grid-column: 1; }
    .form-row { grid-template-columns: 1fr; }
    .form-field-full { grid-column: 1; }
    .float-wa { bottom: 80px; }
    .submit-wa { font-size: 15px; padding: 14px; }
  }

  /* Phones: "For Businesses" + phone number + Chat overflowed the header. */
  @media (max-width: 640px) {
    .call-link { display: none; }
  }

  .mobile-book-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px 14px; z-index: 95; box-shadow: 0 -4px 14px rgba(0,0,0,0.08); justify-content: space-between; align-items: center; gap: 12px; }
  .mobile-book-bar .mb-name strong { font-size: 14px; color: var(--text); }
  .mobile-book-bar .mb-name span { font-size: 12px; color: var(--text-muted); display: block; }
  .mobile-book-bar .mb-btn { background: var(--whatsapp); color: #fff !important; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  @media (max-width: 640px) {
    .mobile-book-bar { display: flex; }
    .float-wa { display: none; }
    body { padding-bottom: 70px; }
  }
  /* Recommendation rails (/api/reco/listing/:id) — same look as /styles.css. */
  .reco-sub { font-size: 12.5px; color: var(--text-muted); margin: -8px 0 14px; }
  .reco-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .reco-card { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; min-width: 0; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .reco-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow); }
  .reco-card.is-sponsored { border-color: #FDE68A; background: linear-gradient(180deg, #FFFBEB, #fff); }
  .reco-name { font-size: 14px; font-weight: 700; line-height: 1.3; color: var(--text); overflow-wrap: anywhere; }
  .reco-card:hover .reco-name { color: var(--primary); }
  .reco-card .reco-link::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
  .reco-meta { font-size: 12px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .reco-meta .rating-pill { background: var(--success); color: #fff; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .reco-why { font-size: 12px; font-weight: 600; color: #B45309; line-height: 1.35; }
  .reco-web { position: relative; z-index: 1; font-size: 12px; font-weight: 600; color: var(--primary); align-self: flex-start; }
  .badge-sponsored { position: absolute; top: 10px; right: 10px; background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .reco-card.is-sponsored .reco-name { padding-right: 78px; }
  .reco-skel { height: 84px; border-radius: 12px; background: linear-gradient(90deg, #F3F4F6 25%, #E5E7EB 37%, #F3F4F6 63%); background-size: 400% 100%; animation: recoShimmer 1.4s ease infinite; }
  @keyframes recoShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  @media (prefers-reduced-motion: reduce) { .reco-skel { animation: none; } }
  @media (max-width: 560px) { .reco-row { grid-template-columns: 1fr; } }

  /* ---- Header menu (toggle wired in /nav-auth.js) ---- */
  .hdr-links { display: flex; align-items: center; gap: 2px; }
  .hdr-links a { color: var(--text); font-weight: 500; font-size: 14px; padding: 8px 10px; border-radius: 8px; white-space: nowrap; }
  .hdr-links a:hover { background: var(--bg-alt); color: var(--primary); }
  .nav-toggle { display: none; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text); flex-shrink: 0; }
  .nav-toggle svg { width: 20px; height: 20px; }
  @media (max-width: 1100px) { .hdr-links a.hl-extra { display: none; } }
  @media (max-width: 768px) {
    .header-inner { position: relative; height: 64px; }
    .header-right { gap: 8px; }
    .brand-logo { height: 40px; }
    .nav-toggle { display: inline-flex; }
    .hdr-links { display: none; }
    .hdr-links.nav-open { display: flex; flex-direction: column; align-items: stretch; gap: 0; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 14px 28px rgba(2,6,23,.10); padding: 6px 16px 12px; z-index: 101; }
    .hdr-links.nav-open a, .hdr-links.nav-open a.hl-extra { display: flex; align-items: center; min-height: 48px; font-size: 15px; border-bottom: 1px solid var(--bg-alt); border-radius: 0; }
    .hdr-links.nav-open a:last-child { border-bottom: none; }
    .header-cta { width: 44px; height: 44px; padding: 0; justify-content: center; }
    .header-cta span { display: none; }
    .header-cta svg { width: 20px; height: 20px; }
    .container { padding: 0 16px; }
    .form-field input, .form-field select, .form-field textarea { font-size: 16px; }
    .pdp-main section, .booking-card { padding: 18px; }
    .policy-list li { flex-direction: column; gap: 2px; }
    .policy-list li span:last-child { text-align: left; }
  }

  /* ---- Robustness + a11y ---- */
  .pdp-layout > * { min-width: 0; }
  .pdp-main section, .title-block h1, .breadcrumb, footer, #p24Reviews { overflow-wrap: anywhere; }
  /* Review cards: a long unbroken name or URL pushed the page 360px wider. */
  #p24Reviews strong { min-width: 0; }
  #p24Reviews span { white-space: nowrap; }
  #p24Reviews { padding: 0; }
  #p24Reviews section { border: 1px solid var(--border); margin-bottom: 48px; }
  #p24Reviews h2 { font-size: 18px; font-weight: 700; }
  .title-block > div:first-child { min-width: 0; }
  .share-btn { min-height: 40px; }
  .secondary-call, .submit-wa { min-height: 48px; }
  .booking-card, #p24Reviews { scroll-margin-top: 84px; }
  .gallery figure { min-width: 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(37,99,235,.55); outline-offset: 2px; }
  .mobile-book-bar { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .mobile-book-bar .mb-name { min-width: 0; flex: 1; }
  .mobile-book-bar .mb-name strong, .mobile-book-bar .mb-name span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mobile-book-bar .mb-btn { min-height: 44px; flex-shrink: 0; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="/" class="brand">
      <img class="brand-logo" src="/pets24x7_logo.png" alt="Pets24x7" />
    </a>
    <div class="header-right">
      <nav class="hdr-links" id="siteNav" aria-label="Main">
        <a href="/#cats" class="hl-extra">Categories</a>
        <a href="/marketing.html">For Businesses</a>

<script>/* Recommendations on a listing page: "Top-rated similar" (with at most one
   labelled sponsored card first) and "Also nearby", from GET /api/reco/listing/:id.
   Both sections stay hidden when the API has nothing or fails. Impressions and
   clicks go through /reco-track.js; internal links carry ?src=reco_<surface>. */
(function(){
  var RBASE = (window.PETS_CONFIG && window.PETS_CONFIG.API_BASE) ||
    ((location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '') ? '' : 'https://api.pets24x7.com');

  function resc(v){
    return String(v == null ? '' : v).replace(/[<>&"']/g, function(c){
      return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function itemUrl(it, surface){
    var u = String(it.url || '');
    if (!/^\/(?!\/)/.test(u)) {
      u = '/' + String(it.country || 'in').toLowerCase() + '/' + encodeURIComponent(it.city_slug || '') + '/' + encodeURIComponent(it.id) + '/';
    }
    if (u.indexOf('src=') === -1) u += (u.indexOf('?') === -1 ? '?' : '&') + 'src=reco_' + surface;
    return u;
  }
  // Outbound vendor links carry UTM so the business sees Pets24x7 traffic in
  // its own analytics. The API already adds it; this only fills a gap.
  function outUrl(u, surface){
    try {
      var x = new URL(String(u || ''));
      if (!/^https?:$/.test(x.protocol)) return '';
      if (!x.searchParams.has('utm_source')) {
        x.searchParams.set('utm_source', 'pets24x7');
        x.searchParams.set('utm_medium', 'referral');
        x.searchParams.set('utm_campaign', 'reco_' + surface);
      }
      return x.toString();
    } catch (e) { return ''; }
  }
  function cardHtml(it, rid, surface, pos){
    var sp = !!it.sponsored;
    var label = it.label || 'Sponsored';
    var rc = Number(it.review_count) || 0;
    var rating = rc >= 1 ? (Number(it.rating) || 0) : 0;  // no count, no score
    var why = sp ? '' : ((it.reason && it.reason.text) || '');
    var web = sp && it.website ? outUrl(it.website, surface) : '';
    var reason = sp ? 'SPONSORED' : ((it.reason && it.reason.code) || '');
    return '<article class="reco-card' + (sp ? ' is-sponsored' : '') + '"' +
        ' data-rid="' + resc(rid) + '" data-lid="' + resc(it.id) + '" data-pos="' + (Number(it.pos) || pos) + '"' +
        ' data-reason="' + resc(reason) + '" data-sp="' + (sp ? '1' : '0') + '" data-surface="' + surface + '">' +
      (sp ? '<span class="badge-sponsored" aria-label="Sponsored listing">' + resc(label) + '</span>' : '') +
      '<a class="reco-name reco-link" href="' + resc(itemUrl(it, surface)) + '">' + resc(it.name) + '</a>' +
      '<div class="reco-meta">' +
        (rating ? '<span class="rating-pill">★ ' + rating.toFixed(1) + '</span>' : '') +
        (rc ? '<span>' + rc + ' reviews</span>' : '') +
        '<span>' + resc(it.category_icon || '') + ' ' + resc(it.category || '') + '</span>' +
      '</div>' +
      (why ? '<div class="reco-why">' + resc(why) + '</div>' : '') +
      (web ? '<a class="reco-web" href="' + resc(web) + '" target="_blank" rel="sponsored noopener">Website ↗</a>' : '') +
    '</article>';
  }
  function skeleton(n){ var s = ''; for (var i = 0; i < n; i++) s += '<div class="reco-skel" aria-hidden="true"></div>'; return s; }

  function whenTracker(fn){
    if (window.recoTrack) { try { fn(window.recoTrack); } catch (e) {} return; }
    window.addEventListener('load', function(){ if (window.recoTrack) { try { fn(window.recoTrack); } catch (e) {} } });
  }
  // Card clicks: the tracker when it loaded, otherwise one keepalive event so
  // a slow or blocked /reco-track.js does not lose the click.
  function onCardClick(el){
    var d = el.dataset || {};
    var sp = d.sp === '1';
    try { if (window.trackEvent) window.trackEvent(sp ? 'sponsored_click' : 'reco_click', { surface: d.surface, reason: d.reason, listing_id: d.lid }); } catch (e) {}
    if (window.recoTrack && window.recoTrack.click) { try { window.recoTrack.click(el); } catch (e) {} return; }
    var ev = { rid: d.rid, type: 'click', listingId: d.lid, pos: Number(d.pos) || undefined, reason: d.reason || undefined, sponsored: sp, surface: d.surface };
    try { sessionStorage.setItem('reco:last', JSON.stringify({ rid: d.rid, listingId: d.lid, surface: d.surface, pos: ev.pos, reason: d.reason, sponsored: sp, ts: Date.now() })); } catch (e) {}
    try {
      fetch(RBASE + '/api/reco/events', { method: 'POST', credentials: 'include', keepalive: true,
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ events: [ev] }) }).catch(function(){});
    } catch (e) {}
  }
  function wire(box){
    if (box.getAttribute('data-reco-wired')) return;
    box.setAttribute('data-reco-wired', '1');
    box.addEventListener('click', function(ev){
      var a = ev.target && ev.target.closest ? ev.target.closest('a') : null;
      var el = a && a.closest('[data-lid]');
      if (el) onCardClick(el);
    });
  }

  function fill(sectionId, items, rid, surface, lead){
    var sec = document.getElementById(sectionId);
    var box = document.getElementById(sectionId + 'List');
    if (!sec || !box) return;
    var list = (lead ? [lead] : []).concat(items || []);
    if (!list.length) { sec.hidden = true; box.innerHTML = ''; return; }
    box.innerHTML = list.map(function(it, i){ return cardHtml(it, rid, surface, i + 1); }).join('');
    sec.hidden = false;
    wire(box);
    whenTracker(function(t){ if (t.observe) t.observe(box, surface); });
  }

  // Landing attribution: ?src=reco_<surface> came from a recommendation card.
  // Returns the src (for the listing_view `source`) and reports the click once
  // when the card's rid is known from sessionStorage 'reco:last'.
  window.recoLandingSource = function(listingId){
    var src = '';
    try { src = new URLSearchParams(location.search).get('src') || ''; } catch (e) {}
    if (!/^reco_[a-z0-9_]{1,35}$/.test(src)) return '';
    try {
      var raw = sessionStorage.getItem('reco:last');
      var last = null;
      if (raw) { try { last = JSON.parse(raw); } catch (e) { last = { rid: raw }; } }
      var rid = last && (typeof last === 'string' ? last : last.rid);
      var lid = last && typeof last === 'object' ? (last.listingId || last.lid) : '';
      if (rid && /^[A-Za-z0-9_-]{8,64}$/.test(rid) && (!lid || lid === listingId)) {
        sessionStorage.removeItem('reco:last');
        var ev = { rid: rid, type: 'click', listingId: listingId, surface: src.slice(5) };
        if (last && typeof last === 'object') {
          if (last.pos) ev.pos = Number(last.pos) || undefined;
          if (last.reason) ev.reason = last.reason;
          if (last.sponsored != null || last.sp != null) ev.sponsored = !!(last.sponsored || last.sp === '1' || last.sp === true);
        }
        fetch(RBASE + '/api/reco/events', { method: 'POST', credentials: 'include', keepalive: true,
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ events: [ev] }) }).catch(function(){});
      }
    } catch (e) {}
    return src;
  };

  window.loadRecoListing = function(listingId){
    if (!listingId || !window.fetch) return;
    var simBox = document.getElementById('recoSimilarList');
    var simSec = document.getElementById('recoSimilar');
    if (simBox && simSec) { simBox.innerHTML = skeleton(3); simSec.hidden = false; }
    var nearBox = document.getElementById('recoNearbyList');
    var nearSec = document.getElementById('recoNearby');
    if (nearBox && nearSec) { nearBox.innerHTML = skeleton(3); nearSec.hidden = false; }
    fetch(RBASE + '/api/reco/listing/' + encodeURIComponent(listingId) + '?limit=6', { credentials: 'omit', headers: { 'Accept': 'application/json' } })
      .then(function(r){ if (!r.ok) throw new Error('reco ' + r.status); return r.json(); })
      .then(function(d){
        if (!d || !d.ok) throw new Error('reco');
        var rid = d.rid || '';
        var sponsored = d.sponsored && d.sponsored.id !== listingId ? d.sponsored : null;
        var similar = (d.similar || []).filter(function(it){ return it && it.id !== listingId && (!sponsored || it.id !== sponsored.id); });
        var seen = {}; similar.forEach(function(it){ seen[it.id] = 1; }); if (sponsored) seen[sponsored.id] = 1;
        var nearby = (d.nearby || []).filter(function(it){ return it && it.id !== listingId && !seen[it.id]; });
        fill('recoSimilar', similar, rid, 'listing_similar', sponsored);
        fill('recoNearby', nearby, rid, 'listing_nearby', null);
      })
      .catch(function(){
        ['recoSimilar', 'recoNearby'].forEach(function(id){ var s = document.getElementById(id); if (s) s.hidden = true; });
      });
  };
})();

<script>
  function qs(name) { var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; }
  function titleCase(s) { return (s||'').replace(/(^|[\s-])(\w)/g, function(_,a,b){ return a + b.toUpperCase(); }); }
  function esc(s) { return (s == null ? '' : String(s)).replace(/[<>&"']/g, function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c];}); }
  function escapeAttr(s){ return esc(s); }

  function seedOf(s){ return (s||'').split('').reduce(function(a,c){return a + c.charCodeAt(0);}, 0); }

  // Factual one-liner only — no fabricated service/facility claims.
  function summaryFor(b) {
    var where = b.address ? b.address : (b.city + (b.state ? ', ' + b.state : ''));
    return esc(b.name) + ' is a Google-listed ' + esc(String(b.category || 'pet service').toLowerCase()) + ' at ' + esc(where) + '. ' +
           'Pets24x7 shows verified public listing details only — confirm exact services, availability and pricing with the business directly.';
  }

  // Real, business-specific map embed (no API key). Prefer Google Place by CID,
  // fall back to an address query, then null (caller shows an icon).
  function mapEmbedSrc(b) {
    if (b && b.google_cid) return 'https://www.google.com/maps?cid=' + encodeURIComponent(b.google_cid) + '&output=embed';
    var q = (b && (b.address || [b.name, b.city, b.state, b.pincode].filter(Boolean).join(', '))) || '';
    if (q) return 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed';
    return null;
  }

  var CAT_EMOJI = {
    'veterinary-clinics':'🩺','emergency-animal-hospital':'🚑','vaccination-centers':'💉','mobile-vet-services':'🚐',
    'specialty-vets-exotics-avian-reptiles':'🦎','veterinary-labs-diagnostics':'🔬','pet-dental-care':'🦷',
    'pet-physiotherapy-rehab':'🦴','pet-grooming-spa':'✂️','pet-boarding-daycare':'🏡','pet-walking':'🐕‍🦺',
    'pet-training-obedience-behavior':'🎾','pet-sitting-in-home-care':'🏠','pet-relocation-services':'📦',
    'pet-taxi-transport':'🚕','pet-therapy-services':'💚'
  };

  // Claimed & verified vendors get enquiries routed straight to their own
  // WhatsApp — Pets24x7's own number is the fallback for unclaimed listings,
  // where it doubles as a lead-tracking + vendor-acquisition channel.
  function whatsappBest(b) {
    var direct = b && b.claimed && String((b.whatsapp || b.phone || '')).replace(/[^0-9]/g, '');
    var msg = direct
      ? "Hi! I found your business '" + b.name + "' on Pets24x7. Please share availability, services and pricing."
      : "Hi Pets24x7! I'm interested in '" + b.name + "' (" + b.category + ", " + b.city + "). Please share availability, services and pricing.";
    var num = (direct && direct.length >= 10) ? direct : '919930090487';
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg) + '&utm_source=website&utm_medium=listing_page&utm_campaign=enquiry';
  }

  // ---- Load ----
  // A clean /in/<city>/<id>/ URL that has no pre-built folder is rewritten to
  // this page by the host, and a rewrite keeps the browser URL clean — so the
  // path is the source of truth and the query string is only the legacy form.
  function fromPath() {
    var parts = location.pathname.split('/').filter(Boolean);
    if (parts.length >= 3 && (parts[0] === 'in' || parts[0] === 'us')) {
      return { country: parts[0], city: parts[1], id: decodeURIComponent(parts[2]) };
    }
    return null;
  }
  var path = fromPath();
  var country = (qs('country') || (path && path.country) || 'IN').toUpperCase();
  var citySlug = (qs('city') || (path && path.city) || '').toLowerCase();
  var id = qs('id') || (path && path.id) || '';
  var content = document.getElementById('content');
  var biz = null;

  // Legacy query-string visitors: JS redirect to the canonical clean URL.
  if (location.search && citySlug && id) {
    var cleanPath = '/' + country.toLowerCase() + '/' + encodeURIComponent(citySlug) + '/' + encodeURIComponent(id) + '/';
    if (location.pathname !== cleanPath) {
      var keepSrc = qs('src');
      location.replace(cleanPath + (/^reco_[a-z0-9_]{1,35}$/.test(keepSrc) ? '?src=' + keepSrc : ''));
    }
  }

  function notFound(err) {
    // No listing, so nothing to enquire about: drop the phone booking bar.
    var mb = document.getElementById('mobileBar'); if (mb) mb.style.display = 'none';
    document.title = 'Listing not available | Pets24x7';
    // The host answers 200 for every /in/<city>/<id>/ (this template is the
    // fallback), so a hidden, removed or mistyped listing is a soft 404: keep
    // it out of the index. Only when the API said so — a network error or 5xx
    // must not noindex a live listing.
    if (!err || /^(api 404|no listing)$/.test(String(err.message || ''))) {
      var rb = document.createElement('meta');
      rb.name = 'robots'; rb.content = 'noindex,follow';
      document.head.appendChild(rb);
    }
    content.innerHTML = '<div class="container"><div class="not-found"><h2>This listing isn\'t available right now</h2><p>It may have moved, been delisted, or the link is incorrect.</p>' +
      '<div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">' +
      '<a href="/' + country.toLowerCase() + '/' + encodeURIComponent(citySlug || 'mumbai') + '/" style="background:#2563EB;color:#fff;padding:12px 22px;border-radius:8px;font-weight:700;">← Browse listings in this city</a>' +
      '<a href="/" style="background:#fff;border:2px solid #2563EB;color:#2563EB;padding:10px 22px;border-radius:8px;font-weight:700;">Back to home</a></div></div></div>';
  }

  var API_BASE = (window.PETS_CONFIG && window.PETS_CONFIG.API_BASE) ||
    ((location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '')
      ? '' : 'https://api.pets24x7.com');

  // The bundled data/*.json only covers a few cities. For every other listing,
  // fall back to the live API so any /in/<city>/<id>/ URL resolves.
  function loadFromApi() {
    return fetch(API_BASE + '/api/listings/' + encodeURIComponent(id), { headers: { 'Accept': 'application/json' } })
      .then(function(r){ if (!r.ok) throw new Error('api ' + r.status); return r.json(); })
      .then(function(d){
        if (!d || !d.ok || !d.listing) throw new Error('no listing');
        biz = d.listing;
        render();
      });
  }

  if (!id) { notFound(); }
  else if (!citySlug) {
    loadFromApi().catch(notFound);
  } else {
    fetch('/data/' + country.toLowerCase() + '-' + encodeURIComponent(citySlug) + '.json', { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('no city'); return r.json(); })
      .then(function(arr){
        biz = arr.find(function(x){ return x.id === id; });
        if (biz) { render(); mergeVendorExtras(); return; }
        return loadFromApi();
      })
      .catch(function(){ loadFromApi().catch(notFound); });
  }

  // Bundled JSON has no claimed-vendor data — pull the vendor's uploaded
  // photo, gallery, about/hours/services copy, WhatsApp number and claimed
  // state from the API and re-render so a claimed listing shows its real
  // profile instead of the static scrape.
  function mergeVendorExtras() {
    fetch(API_BASE + '/api/listings/' + encodeURIComponent(id), { headers: { 'Accept': 'application/json' } })
      .then(function(r){
        // The data file is a publish-time snapshot. A 404 from the live API
        // means the listing was hidden or removed since, so stop showing it
        // (network errors and 5xx keep the snapshot).
        if (r.status === 404) { biz = null; notFound(); return null; }
        return r.ok ? r.json() : null;
      })
      .then(function(d){
        if (!d || !d.listing || !biz) return;
        var changed = false;
        ['imageUrl', 'gallery', 'about', 'openingHours', 'servicesList', 'whatsapp', 'claimed'].forEach(function(k){
          if (d.listing[k] != null && d.listing[k] !== '' && (Array.isArray(d.listing[k]) ? d.listing[k].length : true)) {
            biz[k] = d.listing[k];
            changed = true;
          } else if (k === 'claimed') {
            biz.claimed = !!d.listing.claimed; // still record claim state even with no other extras
          }
        });
        if (changed) render();
      })
      .catch(function(){});
  }

  // Pet-themed image pool by category (same set used across the site).
  // Category photos live in /pet-images.js (single verified pool; the copy
  // that used to live here still referenced two deleted Unsplash ids, so those
  // categories rendered broken frames).
  function imgFor(b, idx, w, h) { return window.PetImages.imgFor(b, idx, w, h); }

  // 4-image photo collage. A vendor's uploaded photo (if any) is the big one.
  var GALLERY_CAPS = ['Overview', 'The space', 'Pet care in action', 'Happy pets'];
  function galleryHtml(b) {
    // A vendor's own uploaded photos (gallery, up to 4 beyond the cover) take
    // the remaining slots ahead of the generic category stock photos.
    var extra = Array.isArray(b && b.gallery) ? b.gallery.filter(Boolean) : [];
    var imgs = [
      (b && b.imageUrl) ? b.imageUrl : imgFor(b, 0, 1000, 620),
      extra[0] || imgFor(b, 1, 500, 320),
      extra[1] || imgFor(b, 2, 500, 320),
      extra[2] || imgFor(b, 3, 1000, 320)
    ];
    var cls = ['g-main', '', '', 'g-wide'];
    var figs = imgs.map(function(src, i) {
      return '<figure class="' + cls[i] + '">' +
        '<img src="' + escapeAttr(src) + '" alt="' + escapeAttr(b.name) + ' — ' + GALLERY_CAPS[i] + '" ' +
        (i === 0 ? 'loading="eager"' : 'loading="lazy"') + '>' +
        '<figcaption>' + GALLERY_CAPS[i] + '</figcaption>' +
        '</figure>';
    }).join('');
    return '<div class="gallery">' + figs + '</div>';
  }

  // Scrape data sometimes has junk in `website` (Google Ads /aclk redirects,
  // bare paths, google.com links). Only accept a real external http(s) URL.
  function cleanWebsite(w) {
    if (!w || typeof w !== 'string') return null;
    w = w.trim();
    if (!/^https?:\/\//i.test(w)) return null;
    try {
      var u = new URL(w);
      var h = u.hostname.toLowerCase();
      if (/(^|\.)google\.(com|co\.[a-z]+)$/.test(h) || h === 'business.google.com' || u.pathname.indexOf('/aclk') === 0) return null;
      return u.href;
    } catch (e) { return null; }
  }

  function shareListing() {
    if (navigator.share) { navigator.share({ title: document.title, url: location.href }).catch(function(){}); return; }
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      if (window.uiPrompt) uiPrompt({ title: 'Copy this link', label: 'Link', value: location.href, confirmLabel: 'Done', required: false });
      return;
    }
    navigator.clipboard.writeText(location.href).then(function(){
      var btn = document.querySelector('.share-btn'); if (btn) { var t = btn.textContent; btn.textContent = '✓ Link copied'; setTimeout(function(){ btn.textContent = t; }, 1600); }

      .then(function(r){ return r.json(); }).then(function(m){

          return fetch(API_BASE + '/api/parent/saved', { credentials: 'include' })
            .then(function(r){ return r.json(); }).then(function(s){

              renderSaveBtn();

      (saveState.ready || initSaveState()).then(function(){

        toggleSave();

    if (saveState.role !== 'pet_parent') {

  // A listing served through this fallback page (added after the last static
  // build — see vercel.json / _redirects) never gets the JSON-LD that
  // build_pages.py bakes into a fully-built page. Inject the same shape
  // client-side so it isn't missing structured data until the next rebuild.
  function injectJsonLd(b) {
    try {
      var canonUrl = 'https://pets24x7.com/' + String(b.country || '').toLowerCase() + '/' +
        encodeURIComponent(b.city_slug || '') + '/' + encodeURIComponent(b.id) + '/';
      var localBusiness = {
        '@context': 'https://schema.org',
        '@type': 'LocalBusiness',
        '@id': canonUrl,
        name: b.name,
        url: canonUrl,
        image: (b.imageUrl) || undefined,
        description: b.name + ' is a verified ' + String(b.category || 'pet service').toLowerCase() +
          ' in ' + b.city + (b.state ? ', ' + b.state : '') + '.' +
          ((b.review_count || 0) >= 1 && (b.rating || 0) > 0
            ? ' Rated ' + b.rating + '/5 on Google from ' + b.review_count + ' reviews.'
            : ''),
        address: {
          '@type': 'PostalAddress',
          streetAddress: b.address || '',
          addressLocality: b.city || '',
          addressRegion: b.state || '',
          postalCode: b.pincode || '',
          addressCountry: b.country || ''
        }
      };
      // "postalCode": "" is an invalid value to a validator where a missing
      // optional field is not (same rule as build_pages.listing_jsonld).
      Object.keys(localBusiness.address).forEach(function(k){ if (!localBusiness.address[k]) delete localBusiness.address[k]; });
      if ((b.review_count || 0) >= 1 && (b.rating || 0) > 0) {
        localBusiness.aggregateRating = {
          '@type': 'AggregateRating',
          ratingValue: b.rating,
          reviewCount: b.review_count,
          bestRating: 5,
          worstRating: 1
        };
      }
      if (b.phone) localBusiness.telephone = b.phone;
      var sameAs = [cleanWebsite(b.website), b.gmb_link].filter(Boolean);
      if (sameAs.length) localBusiness.sameAs = sameAs;

      var breadcrumb = {
        '@context': 'https://schema.org',
        '@type': 'BreadcrumbList',
        itemListElement: [
          { '@type': 'ListItem', position: 1, name: 'Home', item: 'https://pets24x7.com/' },
          { '@type': 'ListItem', position: 2, name: 'Pet services in ' + b.city, item: 'https://pets24x7.com/' + String(b.country || '').toLowerCase() + '/' + encodeURIComponent(b.city_slug || '') + '/' },
          { '@type': 'ListItem', position: 3, name: b.category, item: 'https://pets24x7.com/' + String(b.country || '').toLowerCase() + '/' + encodeURIComponent(b.city_slug || '') + '/' + encodeURIComponent(b.category_slug || '') + '/' },
          { '@type': 'ListItem', position: 4, name: b.name }
        ]
      };
      // A self-registered business can lack a category slug: skip that crumb
      // rather than point it at the city page, and keep positions contiguous.
      if (!b.category_slug) {
        breadcrumb.itemListElement.splice(2, 1);
        breadcrumb.itemListElement[2].position = 3;
      }

      ['ld-localbusiness', 'ld-breadcrumb'].forEach(function(id){ var old = document.getElementById(id); if (old) old.remove(); });
      var s1 = document.createElement('script'); s1.type = 'application/ld+json'; s1.id = 'ld-localbusiness'; s1.textContent = JSON.stringify(localBusiness);
      var s2 = document.createElement('script'); s2.type = 'application/ld+json'; s2.id = 'ld-breadcrumb'; s2.textContent = JSON.stringify(breadcrumb);
      document.head.appendChild(s1);
      document.head.appendChild(s2);
    } catch (e) {}
  }

                </div>\
                <div class="form-row">\
                  <div class="form-field form-field-full"><label for="fNotes">What do you need? *</label><textarea id="fNotes" required placeholder="e.g. Grooming for a Golden Retriever this Saturday, anti-tick bath + nail clip."></textarea></div>\
                </div>\
                <div class="form-error" id="formError"></div>\
                <button type="submit" class="submit-wa">\
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24z"/></svg>\
                  Send Enquiry on WhatsApp\
                </button>\
                ' + (biz.phone ? '<a href="tel:' + escapeAttr(String(biz.phone).replace(/\s+/g,"")) + '" class="secondary-call">📞 Or call ' + esc(biz.phone) + '</a>' : '<a href="tel:+919930090487" class="secondary-call">📞 Or call Pets24x7 +91 99300 90487</a>') + '\
              </form>\
              <ul class="trust-points">\
                <li>Verified Google-listed business</li>\
                <li>Direct contact — no booking fees</li>\
                <li>We respond on WhatsApp within 5 minutes</li>\
                <li>Free to enquire · No commitment</li>\
              </ul>\
            </div>\
          </aside>\
        </div>\
        <div class="container" id="p24Reviews" style="margin-top:8px;"></div>\
      </div>';

    injectJsonLd(biz);
    loadP24Reviews(biz.id);
    initSaveState();
    prefillFromAccount();
    if (!viewLogged) {
      viewLogged = true;
      recoSrc = window.recoLandingSource ? window.recoLandingSource(biz.id) : '';
      logTap('listing_view');
    }
    if (window.loadRecoListing) window.loadRecoListing(biz.id);

    // default date: tomorrow
    var today = new Date(); var d1 = new Date(today); d1.setDate(d1.getDate()+1);
    function fmt(d){ return d.toISOString().slice(0,10); }
    var di = document.getElementById('fDate'); if (di) { di.value = fmt(d1); di.min = fmt(today); }
  }

  // Read from /config.js (single source of truth for all forms across the site).
  var LEADS_WEBAPP_URL = (window.PETS_CONFIG && window.PETS_CONFIG.LEADS_WEBAPP_URL) || '';

  function pushLeadToSheet(data) {
    if (!LEADS_WEBAPP_URL) return;
    try {
      var body = new URLSearchParams();
      Object.keys(data).forEach(function(k){ body.append(k, data[k] == null ? '' : String(data[k])); });
      body.append('userAgent', navigator.userAgent || '');
      body.append('page', location.pathname || 'listing.html');
      fetch(LEADS_WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: body }).catch(function(){});
    } catch (e) {}
  }

  // Also persist every lead into the Pets24x7 API (DB) so it shows in the
  // parent/vendor/admin dashboards. Fire-and-forget; never blocks the WhatsApp handoff.
  function pushLeadToApi(data) {
    try {
      fetch(API_BASE + '/api/enquiries', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      }).catch(function(){});
    } catch (e) {}
  }

  // Pets24x7-hosted (published) reviews for this listing — separate from Google —
  // plus the "Leave a review" form the generated listing pages carry.
  function loadP24Reviews(listingId) {
    var box = document.getElementById('p24Reviews');
    if (!box || !listingId) return;
    var esc2 = function(s){ return (s == null ? '' : String(s)).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); };
    var fld = 'display:block;width:100%;margin-top:5px;padding:10px 12px;min-height:44px;border:1px solid var(--border,#e5e7eb);border-radius:8px;font:inherit;font-size:16px;font-weight:400;color:var(--text,#111827);background:#fff;';
    var lbl = 'display:block;flex:1 1 180px;min-width:0;font-size:12px;font-weight:700;color:var(--text-muted,#6b7280);';
    box.innerHTML = '<section style="background:#fff;border-radius:14px;padding:20px;margin-top:16px;">' +
      '<h2 style="margin:0 0 4px;">Reviews on Pets24x7</h2>' +
      '<div id="p24rvSummary" style="color:var(--text-muted,#6b7280);font-size:13px;">Loading reviews…</div>' +
      '<div id="p24rvList" style="margin-top:14px;"></div>' +
      '<div style="margin-top:18px;border:1px solid var(--border,#e5e7eb);border-radius:12px;padding:18px;">' +
        '<h3 style="font-size:15px;font-weight:800;margin:0 0 4px;">Been here? Leave a review</h3>' +
        '<p style="font-size:13px;color:var(--text-muted,#6b7280);margin:0 0 14px;">Reviews are checked by our team before they appear.</p>' +
        '<form id="p24rvForm" novalidate>' +
          '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;">' +
            '<label style="' + lbl + '">YOUR NAME<input id="rvName" type="text" required autocomplete="name" maxlength="80" placeholder="e.g. Priya S." style="' + fld + '"></label>' +
            '<label style="' + lbl + '">RATING<select id="rvRating" style="' + fld + '"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Okay</option><option value="2">★★ Poor</option><option value="1">★ Bad</option></select></label>' +
          '</div>' +
          '<label style="' + lbl + '">YOUR REVIEW<textarea id="rvText" rows="4" required maxlength="2000" placeholder="What was the visit like? Be specific and fair." style="' + fld + 'resize:vertical;"></textarea></label>' +
          '<div id="rvMsg" role="status" aria-live="polite" style="font-size:13px;margin-top:10px;"></div>' +
          '<button type="submit" id="rvSubmit" style="margin-top:12px;min-height:44px;background:var(--primary,#2563EB);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;">Submit review</button>' +
        '</form>' +
      '</div></section>';
    document.getElementById('p24rvForm').addEventListener('submit', function(ev){ submitP24Review(ev, listingId); });

    var sum = document.getElementById('p24rvSummary');
    var list = document.getElementById('p24rvList');
    fetch(API_BASE + '/api/reviews/listing/' + encodeURIComponent(listingId), { headers: { 'Accept': 'application/json' } })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.count) { sum.textContent = 'No Pets24x7 reviews yet. Be the first to leave one.'; return; }
        sum.textContent = 'Average ' + (d.average || '–') + '/5 from ' + (Number(d.count) || 0) + ' review' + (d.count === 1 ? '' : 's') + ' collected via Pets24x7.';
        list.innerHTML = (d.reviews || []).map(function(rv){
          return '<div style="border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:14px;margin-bottom:10px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
            '<strong>' + esc2(rv.reviewerName) + '</strong>' +
            '<span style="color:#D97706;font-weight:700;">★ ' + (Number(rv.rating) || 0).toFixed(1) + '</span></div>' +
            '<p style="margin:6px 0 0;font-size:14px;line-height:1.5;">' + esc2(rv.text) + '</p>' +
            (rv.vendorReply ? '<div style="margin-top:8px;padding:8px 10px;background:#F1F5F9;border-radius:8px;font-size:13px;"><strong>Response from the business:</strong> ' + esc2(rv.vendorReply) + '</div>' : '') +
            '</div>';
        }).join('');
      })
      .catch(function(){ sum.textContent = 'Reviews could not be loaded right now.'; });
  }

  function submitP24Review(ev, listingId) {
    ev.preventDefault();
    var msg = document.getElementById('rvMsg');
    var btn = document.getElementById('rvSubmit');
    if (btn.disabled) return;
    var body = {
      reviewerName: document.getElementById('rvName').value.trim(),
      rating: Number(document.getElementById('rvRating').value),
      text: document.getElementById('rvText').value.trim()
    };
    if (body.reviewerName.length < 2) { msg.style.color = '#DC2626'; msg.textContent = 'Please enter your name.'; document.getElementById('rvName').focus(); return; }
    if (body.text.length < 10) { msg.style.color = '#DC2626'; msg.textContent = 'Please write at least a sentence.'; document.getElementById('rvText').focus(); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    msg.style.color = '#6B7280'; msg.textContent = 'Sending…';
    fetch(API_BASE + '/api/reviews/listing/' + encodeURIComponent(listingId), {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if (!r.ok) throw new Error(d.message || d.error || 'Could not submit your review. Please try again.'); return d; }); })
      .then(function(d){
        document.getElementById('p24rvForm').reset();
        msg.style.color = '#047857';
        msg.textContent = d.message || 'Thanks. Your review goes live once checked.';
      })
      .catch(function(e){ msg.style.color = '#DC2626'; msg.textContent = e.message; })
      .finally(function(){ btn.disabled = false; btn.textContent = 'Submit review'; });
  }

  // One enquiry per click: a double tap posted the lead twice and opened a
  // second WhatsApp tab. Re-armed after a few seconds for a genuine resend.
  var enquiryBusyUntil = 0;
  function submitEnquiry(ev) {
    ev.preventDefault();
    if (!biz) return false;
    if (Date.now() < enquiryBusyUntil) return false;
    var name = document.getElementById('fName').value.trim();
    var phone = document.getElementById('fPhone').value.trim();
    var email = (document.getElementById('fEmail') || {}).value || '';
    email = email.trim();
    var pet = document.getElementById('fPetType').value;
    var date = document.getElementById('fDate').value;
    var notes = document.getElementById('fNotes').value.trim();
    var err = document.getElementById('formError');

    if (!name || name.length < 2) { err.textContent = 'Please enter your full name.'; err.classList.add('show'); return false; }
    if (!phone || phone.replace(/[^0-9]/g,'').length < 10) { err.textContent = 'Please enter a valid phone / WhatsApp number.'; err.classList.add('show'); return false; }
    if (!notes) { err.textContent = 'Please describe what you need.'; err.classList.add('show'); return false; }
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      err.textContent = 'That email address does not look right.'; err.classList.add('show'); return false;
    }
    err.classList.remove('show');
    enquiryBusyUntil = Date.now() + 3000;
    var submitBtn = ev.target && ev.target.querySelector ? ev.target.querySelector('[type="submit"], button:not([type])') : null;
    if (submitBtn) {
      submitBtn.disabled = true;
      setTimeout(function () { submitBtn.disabled = false; }, 3000);
    }

    var msg = "🐾 *New Enquiry — Pets24x7.com*\n\n" +
      "*Business:* " + biz.name + "\n" +
      "*Category:* " + biz.category + "\n" +
      "*City:* " + biz.city + (biz.state ? ", " + biz.state : "") + "\n" +
      "*Listing ID:* " + biz.id + "\n\n" +
      "*Customer:* " + name + "\n" +
      "*Phone / WhatsApp:* " + phone + "\n" +
      "*Pet type:* " + pet + "\n" +
      (date ? "*Preferred date:* " + date + "\n" : "") +
      "\n*What they need:* " + notes + "\n" +
      "\nPlease confirm availability & pricing. Thanks!";

    pushLeadToSheet({
      name: name, business: biz.name, category: biz.category,
      city: biz.city, country: biz.country, listing_id: biz.id,
      phone: phone, email: email, pet: pet, date: date, notes: notes,
      source: 'listing_form'
    });

    pushLeadToApi({
      name: name, phone: phone, email: email || undefined,
      listingId: biz.id, listingName: biz.name,
      category: biz.category, city: biz.city,
      country: (biz.country === 'US' || biz.country === 'IN') ? biz.country : undefined,
      petType: pet, preferredDate: date, notes: notes, source: 'listing_page'
    });

    var directNum = biz.claimed && String((biz.whatsapp || biz.phone || '')).replace(/[^0-9]/g, '');
    var waNum = (directNum && directNum.length >= 10) ? directNum : '919930090487';
    var url = 'https://wa.me/' + waNum + '?text=' + encodeURIComponent(msg) + '&utm_source=website&utm_medium=listing_form&utm_campaign=enquiry';
    window.open(url, '_blank');
    try { if (window.trackEvent) window.trackEvent('generate_lead', { listing_id: biz.id, category: biz.category, city: biz.city, source: 'listing_form' }); } catch (e) {}
    if (window.toast) toast(email ? 'Enquiry sent — a confirmation is on its way to ' + email + '.' : 'Enquiry sent — continue the chat on WhatsApp.', 'ok');
    return false;
  }
  window.submitEnquiry = submitEnquiry;

  // Signed-in parents: prefill name/phone/email from their account so the
  // enquiry is attributed to them and the confirmation email always has an
  // address to go to.
  function prefillFromAccount() {
    fetch(API_BASE + '/api/me?role=pet_parent', { credentials: 'include', headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (me) {
        if (!me || me.role !== 'pet_parent' || !me.user) return;
        var set = function (id, val) {
          var el = document.getElementById(id);
          if (el && !el.value && val) el.value = val;
        };
        set('fName', me.user.name);
        set('fPhone', me.user.phone);
        set('fEmail', me.user.email);
      })
      .catch(function () {});
  }

  // Contact taps (phone, WhatsApp, website) and the page view feed the vendor's
  // stats, the admin activity feed and the "most contacted" ranking on city
  // pages. The pre-built listing pages already report these; this fallback page
  // did not, so listings added after the last build were invisible to all three.
  var viewLogged = false;
  var recoSrc = '';   // ?src=reco_<surface> when the visit came from a recommendation card
  function logTap(kind) {
    if (!biz || !biz.id) return;
    try {
      if (window.trackEvent) window.trackEvent(kind, { listing_id: biz.id, listing_name: biz.name, city: biz.city, category: biz.category });
    } catch (e) {}
    try {
      fetch(API_BASE + '/api/activity', {
        method: 'POST', credentials: 'include', keepalive: true,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ listingId: biz.id, kind: kind, source: (kind === 'listing_view' && recoSrc) ? recoSrc : 'listing_page' })
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a') : null;
    if (!a || !biz) return;
    var href = a.getAttribute('href') || '';
    if (href.indexOf('tel:') === 0) logTap('phone_click');
    else if (href.indexOf('wa.me') !== -1 || href.indexOf('api.whatsapp.com') !== -1) logTap('whatsapp_click');
    else if ((a.getAttribute('rel') || '').indexOf('nofollow') !== -1 && /^https?:/.test(href)) logTap('website_click');
  }, true);
</script>

<script src="/nav-auth.js" defer></script>
</body>
</html>
