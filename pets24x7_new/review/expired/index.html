<style>
  :root{--primary:#2563EB;--primary-dark:#1D4ED8;--text:#1F2937;--text-muted:#6B7280;--border:#E5E7EB;--success:#10B981;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--text);background:linear-gradient(135deg,#EFF6FF 0%,#fff 50%,#ECFDF5 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:48px 36px;max-width:480px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(15,23,42,0.08)}
  .icon{width:80px;height:80px;border-radius:50%;background:#FEF3C7;color:#B45309;display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 18px;font-weight:800}
  h1{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:10px}
  p{color:var(--text-muted);font-size:15px;margin-bottom:20px;line-height:1.6}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);text-decoration:none}
  .btn:hover{background:#F9FAFB}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-dark);color:#fff}
  .brand{display:inline-flex;align-items:center;gap:8px;margin-bottom:24px}
  .brand img{height:38px;width:auto;max-width:180px;object-fit:contain;display:block}
  .brand span{font-weight:800;font-size:18px;color:var(--primary);letter-spacing:-0.5px}
  .brand .tld{color:var(--text)}
  .small{font-size:12px;color:var(--text-muted);margin-top:18px}
  button:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,0.45);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  .btn{min-height:44px;justify-content:center}
  .small a{display:inline-block;padding:4px 0}
  @media (max-width:430px){
    body{padding:16px}
    .card{padding:36px 20px;border-radius:16px}
    h1{font-size:22px}
    .actions .btn{flex:1 1 100%}
  }
</style>
<script src="/config.js"></script>
<script src="/analytics.js"></script>
</head>
<body>
<!-- The API's /r/<code> short link sends unknown or expired codes here
     (reviews/public.routes.ts). Without this page that redirect was a 404. -->
<div class="card">
  <div class="brand">
    <img src="/pets24x7_logo.png" alt="Pets24x7" />
  </div>
  <div class="icon">!</div>
  <h1>This review link has expired</h1>
  <p>Review links work once and only for a limited time. If you still want to share your experience, find the business on Pets24x7 and leave a review on its page.</p>
  <div class="actions">
    <a href="/search/" class="btn btn-primary">Find the business &rarr;</a>
    <a href="/" class="btn">Go to home</a>
  </div>
  <p class="small">Think this is a mistake? <a href="https://wa.me/919930090487?text=Hi%20Pets24x7!%20My%20review%20link%20says%20it%20has%20expired." style="color:var(--primary);font-weight:600" target="_blank" rel="noopener">Message us on WhatsApp</a>.</p>
</div>

</body>
</html>
