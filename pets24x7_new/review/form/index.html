<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2563EB" />
<title>Write your review — Pets24x7.com</title>
<meta name="robots" content="noindex" />
<!-- The path carries a one-time review code: pass on only the origin as a referrer. -->
<meta name="referrer" content="origin" />
<meta name="description" content="Write your review on Pets24x7." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Pets24x7" />
<meta property="og:title" content="Write your review — Pets24x7.com" />
<meta property="og:description" content="Write your review on Pets24x7." />
<meta property="og:image" content="https://pets24x7.com/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Write your review — Pets24x7.com" />
<meta name="twitter:description" content="Write your review on Pets24x7." />
<meta name="twitter:image" content="https://pets24x7.com/og-image.jpg" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#2563EB;--primary-dark:#1D4ED8;--bg:#F9FAFB;--text:#1F2937;--text-muted:#6B7280;--border:#E5E7EB;--success:#10B981;--gold:#F59E0B;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--text);background:linear-gradient(135deg,#EFF6FF 0%,#fff 50%,#ECFDF5 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:36px 32px;max-width:480px;width:100%;box-shadow:0 24px 60px rgba(15,23,42,0.08)}
  .brand{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px}
  .brand img{height:38px;width:auto;max-width:180px;object-fit:contain;display:block}
  .brand span{font-weight:800;font-size:18px;color:var(--primary);letter-spacing:-0.5px}
  .brand .tld{color:var(--text)}
  h1{font-size:22px;font-weight:800;letter-spacing:-0.4px;margin-bottom:6px}
  .biz{font-size:14px;color:var(--text-muted);margin-bottom:24px}
  .biz strong{color:var(--text);font-weight:700}
  label{display:block;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;margin-top:18px}
  .stars{display:flex;gap:4px;margin-bottom:6px}
  .star{font-size:36px;cursor:pointer;color:var(--border);transition:color 0.15s;line-height:1;background:none;border:none;padding:0;font-family:inherit}
  .star.on{color:var(--gold)}
  .star:hover{transform:scale(1.05)}
  .rating-lbl{font-size:13px;color:var(--text-muted);font-weight:600;height:18px}
  textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;resize:vertical;min-height:120px;background:#fff}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;background:#fff}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
  .err{background:#FEE2E2;color:#991B1B;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:14px;display:none}
  .err.show{display:block}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--primary);color:#fff;margin-top:18px;box-shadow:0 8px 20px rgba(37,99,235,0.25);transition:all 0.2s}
  .btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
  .small{font-size:12px;color:var(--text-muted);margin-top:14px;text-align:center;line-height:1.5}
  .loading{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  button:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,0.45);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  textarea,input{font-size:16px}
  .biz,.err,.loading{overflow-wrap:anywhere}
  /* Star picker: a proper radio group with 44px targets and keyboard support. */
  .stars{gap:2px}
  .star{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
  .star:focus-visible{outline:3px solid rgba(245,158,11,0.55);outline-offset:0}
  .star.hover{color:#FCD34D}
  .req-note{font-weight:500;text-transform:none;color:var(--text-muted);letter-spacing:0}
  .counter{font-size:12px;color:var(--text-muted);text-align:right;margin-top:4px}
  @media (max-width:430px){
    body{padding:16px;align-items:flex-start;padding-top:max(20px,6vh)}
    .card{padding:28px 20px;border-radius:16px}
    h1{font-size:21px}
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="/pets24x7_logo.png" alt="Pets24x7" />
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Loading…</div>
  </div>

  <div id="content" hidden>
    <h1>Your review</h1>
    <p class="biz" id="bizMeta"></p>

    <label id="ratingHd">Rating *</label>
    <div class="stars" id="stars" role="radiogroup" aria-labelledby="ratingHd">
      <button type="button" class="star" data-r="1" role="radio" aria-checked="false" aria-label="1 star, Terrible" tabindex="0">★</button>
      <button type="button" class="star" data-r="2" role="radio" aria-checked="false" aria-label="2 stars, Bad" tabindex="-1">★</button>
      <button type="button" class="star" data-r="3" role="radio" aria-checked="false" aria-label="3 stars, OK" tabindex="-1">★</button>
      <button type="button" class="star" data-r="4" role="radio" aria-checked="false" aria-label="4 stars, Good" tabindex="-1">★</button>
      <button type="button" class="star" data-r="5" role="radio" aria-checked="false" aria-label="5 stars, Excellent" tabindex="-1">★</button>
    </div>
    <div class="rating-lbl" id="ratingLbl" aria-live="polite"></div>

    <label for="rText">Your review *</label>
    <textarea id="rText" maxlength="2000" placeholder="What did you like? What could be better? (8 characters min)" aria-describedby="rCount"></textarea>
    <div class="counter" id="rCount">0 / 2000</div>

    <label for="rName">Your name <span class="req-note">(optional)</span></label>
    <input id="rName" type="text" maxlength="60" placeholder="Priya Sharma" autocomplete="name" />

    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="submitBtn" type="button">Post my review &rarr;</button>
    <p class="small">Reviews are moderated before going live on the business listing. You won&rsquo;t be charged anything.</p>
  </div>
</div>

<script src="/config.js"></script>
<script src="/analytics.js"></script>
<script src="/api-client.js"></script>
<script>
  function esc(s){return (s||'').toString().replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];})}
  function getCode() {
    var parts = location.pathname.split('/').filter(Boolean);
    var idx = parts.indexOf('review');
    var fromPath = (idx >= 0 && parts[idx + 1] && parts[idx + 1] !== 'form' && parts[idx + 1] !== 'thanks')
                   ? parts[idx + 1] : '';
    var fromQuery = (new URLSearchParams(location.search).get('code') || '');
    return (fromPath || fromQuery).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
  }

  var code = getCode();
  var rating = 0;
  var LABELS = { 1: 'Terrible', 2: 'Bad', 3: 'OK', 4: 'Good', 5: 'Excellent!' };

  var STARS = Array.prototype.slice.call(document.querySelectorAll('.star'));
  function paint(n, cls) {
    STARS.forEach(function (b, i) { b.classList.toggle(cls, (i + 1) <= n); });
  }
  function setRating(r) {
    rating = r;
    paint(r, 'on');
    // Roving tabindex: the chosen star (or the first) is the one Tab lands on.
    STARS.forEach(function (b, i) {
      b.setAttribute('aria-checked', String(i + 1 === r));
      b.tabIndex = (i + 1 === (r || 1)) ? 0 : -1;
    });
    document.getElementById('ratingLbl').textContent = r ? (r + '/5 · ' + LABELS[r]) : '';
  }
  STARS.forEach(function (b) {
    var n = +b.getAttribute('data-r');
    b.addEventListener('click', function () { setRating(n); });
    // Hover preview on mouse only; a touch tap goes straight to click.
    b.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') paint(n, 'hover'); });
    b.addEventListener('pointerleave', function () { paint(0, 'hover'); });
    b.addEventListener('keydown', function (e) {
      var next = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') next = Math.min(5, (rating || 0) + 1);
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') next = Math.max(1, (rating || 2) - 1);
      else if (e.key === 'Home') next = 1;
      else if (e.key === 'End') next = 5;
      if (next === null) return;
      e.preventDefault();
      setRating(next);
      STARS[next - 1].focus();
    });
  });
  var rText = document.getElementById('rText');
  rText.addEventListener('input', function () {
    document.getElementById('rCount').textContent = rText.value.length + ' / 2000';
  });

  if (!code) {
    document.getElementById('loading').innerHTML = 'This review link is incomplete. Open it again from the message the business sent you, or <a href="/">visit Pets24x7</a>.';
  } else {
    api.reviewContext(code).then(function (r) {
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
      document.getElementById('bizMeta').innerHTML =
        'Reviewing <strong>' + esc(r.vendor.businessName) + '</strong>' +
        (r.vendor.city ? ' &middot; ' + esc(r.vendor.city) : '');
      if (r.alreadyReviewed) {
        location.replace('/review/thanks/');
        return;
      }
      if (r.customer && r.customer.name) {
        document.getElementById('rName').value = r.customer.name;
      }
    }).catch(function (err) {
      document.getElementById('loading').innerHTML = (err && err.status === 404)
        ? 'This review link has expired or is invalid. <a href="/">Visit Pets24x7</a>'
        : esc(fmtErr(err)) + ' <a href="">Try again</a>';
    });
  }

  document.getElementById('submitBtn').addEventListener('click', function () {
    var err = document.getElementById('err');
    err.classList.remove('show');
    var text = document.getElementById('rText').value.trim();
    var name = document.getElementById('rName').value.trim();
    if (!code) { err.textContent = 'This review link is incomplete. Open it again from your message.'; err.classList.add('show'); return; }
    if (!rating) { err.textContent = 'Pick a star rating.'; err.classList.add('show'); return; }
    if (text.length < 8) { err.textContent = 'Write at least 8 characters.'; err.classList.add('show'); return; }

    this.disabled = true; this.textContent = 'Posting…';
    var self = this;
    api.reviewSubmit(code, {
      rating: rating,
      text: text,
      reviewerName: name || undefined,
    }).then(function () {
      if (window.trackEvent) window.trackEvent('review_submitted', { rating: rating });
      location.href = '/review/thanks/';
    }).catch(function (e) {
      err.textContent = fmtErr(e);
      err.classList.add('show');
      self.disabled = false; self.textContent = 'Post my review →';
    });
  });
</script>

</body>
</html>
