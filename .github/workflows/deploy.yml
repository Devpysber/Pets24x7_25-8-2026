# Push-triggered deploy. Nudges the VPS to run its existing deploy unit the
# moment main moves, instead of waiting up to two minutes for the timer.
#
# This is a TRIGGER, not the deploy itself: all the logic stays in
# ops/pets24x7-deploy.sh on the server. pets24x7-deploy.timer keeps running as
# the backstop, so a GitHub Actions outage, a rotated key or a failed run here
# delays a deploy by a couple of minutes rather than stopping it.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A burst of pushes should end at the newest commit, not queue one deploy per
  # commit. Never cancel a run mid-flight though — that could leave a half-built
  # release on the server.
  group: deploy-vps
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"         || { echo "VPS_SSH_KEY secret is not set"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS secret is not set"; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          # StrictHostKeyChecking stays on and the host key comes from a secret:
          # accepting whatever key answers would let anyone who can intercept
          # the connection collect this deploy key.
          ssh_vps() {
            ssh -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o ConnectTimeout=15 \
                "$SSH_USER@$SSH_HOST" "$@"
          }

          # pets24x7-deploy.service is Type=oneshot, so `systemctl start` blocks
          # until the deploy finishes and its exit status is the deploy's. The
          # only thing it prints on failure is "the control process exited with
          # error code", which says nothing about what actually broke — every
          # failure then costs a round trip to the box to read the journal by
          # hand. Take the status, then pull the journal back into this log.
          rc=0
          ssh_vps 'sudo systemctl start pets24x7-deploy.service' || rc=$?

          echo "::group::pets24x7-deploy.service - last 200 journal lines"
          ssh_vps 'sudo journalctl -u pets24x7-deploy.service -n 200 --no-pager' \
            || echo "(could not read the journal as $SSH_USER)"
          echo "::endgroup::"

          if [ "$rc" -ne 0 ]; then
            # A rendered release is ~950MB and the site build writes 36k files,
            # so running out of room is a likely cause worth having on record.
            echo "::group::disk"
            ssh_vps 'df -h /var/www /opt; du -sh /var/www/pets24x7-releases/* 2>/dev/null | tail -20' || true
            echo "::endgroup::"
            echo "::error::Deploy failed on the VPS (exit $rc) - see the journal above."
            exit "$rc"
          fi

          echo "Deploy finished. Follow a run live with:"
          echo "  journalctl -u pets24x7-deploy.service -f"
